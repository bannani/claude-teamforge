<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TeamForge Browser</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0 auto; max-width: 420px; padding: 24px 16px; background: #06090f; color: #eef2fb; font: 13px/1.55 Inter, system-ui, sans-serif; }
  h1 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 9px; }
  .orb { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(from 200deg, #59e0f2, #8f7ff8, #f472b6, #59e0f2); }
  .status { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; border: 1px solid; }
  .connected { color: #45de8a; border-color: rgba(69, 222, 138, .4); }
  .other { color: #f6b95c; border-color: rgba(246, 185, 92, .45); }
  p { margin: 10px 0 0; color: #9aa4bd; }
  code { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #59e0f2; }
</style>
</head>
<body>
  <h1><span class="orb" aria-hidden="true"></span>TeamForge Browser</h1>
  <span id="status" class="status other" role="status">…</span>
  <p id="help"></p>
  <p>The team works in its own <strong>TeamForge</strong> tab, on the sites you allowed with <code>/browser &lt;url&gt;</code>. It cannot open another site.</p>
  <script src="popup.js"></script>
</body>
</html>
